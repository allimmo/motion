      <script>
        (function () {
          const root = document.getElementById("s-root");
          const q = (s) => root.querySelector(s);
          const qa = (s) => Array.from(root.querySelectorAll(s));

          const WORDS = ["Ruhige", "2-Zimmer-Wohnung", "mit", "Balkon", "in", "Neubau,", "bis 1.100 €"];
          const textEl = q("#s-text");
          WORDS.forEach((w, i) => {
            const s = document.createElement("span");
            s.className = "s-word";
            s.textContent = w;
            textEl.appendChild(s);
            if (i < WORDS.length - 1) textEl.appendChild(document.createTextNode(" "));
          });
          const wave = q("#s-wave");
          for (let i = 0; i < 12; i++) wave.appendChild(document.createElement("i"));

          const ROWS = [
            ["1.050 €", "2 Zi · 58 m² · Balkon · ruhig", true],
            ["990 €", "2 Zi · 52 m² · Balkon · Hofseite", false],
            ["1.090 €", "2 Zi · 61 m² · Balkon · Altbau", false],
          ];
          const rowsEl = q("#s-rows");
          ROWS.forEach(([price, spec, top], i) => {
            const r = document.createElement("div");
            r.className = "s-row";
            r.id = "s-row" + i;
            r.innerHTML =
              '<span class="s-thumb"></span><span class="s-price">' + price + '</span><span class="s-spec">' + spec + "</span>" +
              (top ? '<span class="s-badge">Top-Treffer</span>' : "");
            rowsEl.appendChild(r);
          });

          gsap.set(["#s-resBusy", "#s-res0", ".s-word", "#s-progress", ".s-row", "#s-say", "#s-chaos"], { opacity: 0 });
          gsap.set("#s-barCam", { scale: 0.93617 });
          gsap.set("#s-ta0", { opacity: 1 });
          gsap.set("#s-tb0", { opacity: 1 });

          const tl = gsap.timeline({ paused: true });
          const soft = "power3.out";
          const fields = qa(".s-field");

          // Both lanes are on screen from frame 0
          tl.fromTo("#s-panelA", { y: -30 }, { y: 0, duration: 0.6, ease: soft }, 0);
          tl.fromTo(["#s-panelB", "#s-headB", "#s-barCam"], { y: 30 }, { y: 0, duration: 0.6, ease: soft }, 0);

          const tok = (ids, times) =>
            ids.forEach((id, n) => {
              if (n > 0) tl.set(ids[n - 1], { opacity: 0 }, times[n]);
              tl.set(id, { opacity: 1 }, times[n]);
            });
          tok(["#s-ta0", "#s-ta1", "#s-ta2"], [0, 3.25, 3.7]);
          tok(["#s-tb0", "#s-tb1", "#s-tb2", "#s-tb3"], [0, 0.55, 2.45, 3.3]);

          // ---------- Old way: click, click, click … nothing ----------
          tl.fromTo("#s-handM", { rotation: 0 }, { rotation: 360 * 7, duration: 4.8, ease: "none" }, 0);
          tl.fromTo("#s-handH", { rotation: 30 }, { rotation: 30 + 360 * 0.6, duration: 4.8, ease: "none" }, 0);
          const P = { bezirk: [250, 201], zimmer: [710, 201], bis: [710, 287], suchen: [822, 379], tabB: [340, 118] };
          tl.fromTo("#s-cursor", { x: 560, y: 470 }, { x: 560, y: 470, duration: 0.01 }, 0);
          const move = (to, t, d) => tl.to("#s-cursor", { x: to[0], y: to[1], duration: d, ease: "power2.inOut" }, t);
          const click = (t) => {
            tl.to("#s-cursor svg", { scale: 0.84, duration: 0.07, ease: "power2.in", transformOrigin: "10% 5%" }, t);
            tl.to("#s-cursor svg", { scale: 1, duration: 0.2, ease: soft }, t + 0.08);
            tl.fromTo("#s-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.4, opacity: 0, duration: 0.4, ease: soft }, t);
          };
          const fill = (i, t) => {
            tl.set(fields[i].querySelector(".s-ph"), { opacity: 0 }, t);
            tl.set(fields[i].querySelector(".s-val"), { opacity: 1 }, t);
          };
          move(P.bezirk, 0.15, 0.38); click(0.53); fill(0, 0.55);
          move(P.zimmer, 0.72, 0.32); click(1.04); fill(1, 1.06);
          move(P.bis, 1.22, 0.3); click(1.52); fill(3, 1.54);
          move(P.suchen, 1.7, 0.36); click(2.06);
          tl.set("#s-resBusy", { opacity: 1 }, 2.1);
          tl.set("#s-resBusy", { opacity: 0 }, 2.75);
          tl.set("#s-res0", { opacity: 1 }, 2.75);
          tl.fromTo("#s-res0", { x: -14 }, { x: 0, duration: 0.3, ease: soft }, 2.75);
          move(P.tabB, 2.95, 0.3); click(3.25);
          tl.to("#s-tabInd", { x: 212, duration: 0.28, ease: "power3.inOut" }, 3.27);
          fields.forEach((f) => {
            tl.set(f.querySelector(".s-ph"), { opacity: 1 }, 3.3);
            tl.set(f.querySelector(".s-val"), { opacity: 0 }, 3.3);
          });
          tl.set("#s-res0", { opacity: 0 }, 3.3);
          move(P.bezirk, 3.55, 0.35); click(3.9); fill(0, 3.92);
          move(P.zimmer, 4.1, 0.3); click(4.4); fill(1, 4.42);

          // ---------- SearchPlace: one sentence ----------
          tl.to("#s-mic", { scale: 0.88, duration: 0.1, ease: "power2.in" }, 0.42);
          tl.to("#s-mic", { scale: 1, duration: 0.4, ease: soft }, 0.53);
          tl.to("#s-placeholder", { opacity: 0, duration: 0.15 }, 0.5);
          [0.55, 1.05, 1.55].forEach((t, k) =>
            tl.fromTo(k % 2 ? "#s-pulse1" : "#s-pulse0", { scale: 1, opacity: 0.8 }, { scale: 1.5, opacity: 0, duration: 0.8, ease: soft }, t)
          );
          qa("#s-wave i").forEach((b, i) => {
            gsap.set(b, { scaleY: 0.25 });
            for (let k = 0; k < 15; k++) {
              const h = 0.25 + 0.75 * Math.abs(Math.sin(i * 0.9 + k * 1.37) * Math.cos(k * 0.41 + i * 0.3));
              tl.to(b, { scaleY: h, duration: 0.12, ease: "sine.inOut" }, 0.6 + k * 0.12);
            }
          });
          qa(".s-word").forEach((w, i) =>
            tl.fromTo(w, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: soft }, 0.75 + i * 0.22)
          );
          tl.fromTo("#s-progress", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.45);
          tl.fromTo("#s-progressFill", { scaleX: 0 }, { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, 2.5);
          tl.to("#s-progress", { opacity: 0, duration: 0.2 }, 3.25);
          [0, 1, 2].forEach((i) =>
            tl.fromTo("#s-row" + i, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 3.3 + i * 0.12)
          );

          // ---------- Takeaway: one sentence instead of filter chaos ----------
          tl.to("#s-panelA", { opacity: 0, y: -60, duration: 0.45, ease: "power2.in" }, 4.85);
          tl.to("#s-vs", { opacity: 0, duration: 0.3 }, 4.85);
          tl.to(["#s-panelB", "#s-headB", "#s-rows"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.9);
