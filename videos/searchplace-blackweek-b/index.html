<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SearchPlace.ai — Black Week Ad B (Vorher/Nachher)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div
        id="el-bg"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="0"
        data-duration="7.95"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-badge"
        data-composition-id="badge"
        data-composition-src="compositions/badge.html"
        data-start="5.3"
        data-duration="2.65"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="7.9"
        data-duration="4.1"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
