        /* ----- search bar (logo shell), logo units 1650 × 415 ----- */
        #s-barCam {

          position: absolute;

        }
        #s-placeholder {
          position: absolute;

        }

        .s-mic {
          position: absolute;

          height: 225px;
          border-radius: 50%;
          background: linear-gradient(180deg, #2cc7de 0%, #12b4cd 55%, #0c9db4 100%);
          box-shadow:
            inset 0 5px 8px rgba(255, 255, 255, 0.28),
            inset 0 -8px 14px rgba(0, 0, 0, 0.22);
        }
        .s-micsvg {
          position: absolute;
          left: 57px;
          top: 57px;
          width: 110px;
          height: 110px;
        }
        .s-pulse {
          position: absolute;
          right: 120px;
          top: 85px;

        .s-tile {
          position: absolute;

          background: #1c1c1e;
          border: 1px solid rgba(255, 255, 255, 0.1);
          overflow: hidden;
        }
        .s-tile::before {
          content: "";
          position: absolute;
          left: 8px;
          right: 8px;
          top: 8px;
          height: 50px;
          border-radius: 11px;
          background: linear-gradient(160deg, #2f5d70, #1592a9);
        }
        .s-tile::after {
          content: "";
          position: absolute;
          left: 10px;
          top: 68px;
          width: 64px;
          height: 8px;
          border-radius: 4px;
          background: #48484a;
        }

        /* ----- agent + notification ----- */
        #s-agent {
          position: absolute;
          left: 90px;
          top: 760px;
          width: 900px;
          height: 168px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 30px;
          border-radius: 32px;
          background: #1c1c1e;
          border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .s-radar {
          position: relative;
          flex: none;
          width: 92px;
          height: 92px;
          border-radius: 50%;
          border: 2px solid rgba(111, 227, 243, 0.45);
          overflow: hidden;
        }
        #s-sweep {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: conic-gradient(from 0deg, rgba(111, 227, 243, 0.55), rgba(111, 227, 243, 0) 26%);
        }
        .s-ameta {
          display: flex;
          flex-direction: column;
          gap: 8px;
          min-width: 0;
          flex: 1;
        }
        .s-ameta span {
          display: block;
          white-space: nowrap;
        }
        .s-aname {
          font-size: 25px;
          font-weight: 600;
          color: #86868b;
        }
        .s-acrit {
          font-size: 32px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        .s-live {
          display: flex;
          align-items: center;
          gap: 10px;
          height: 48px;
          padding: 0 18px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.06);
          color: #d2d2d7;
          font-size: 23px;
          font-weight: 600;
        }
        .s-live i {
          display: block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #6fe3f3;
        }
        #s-note {
          position: absolute;
          left: 130px;
          top: 968px;
          width: 820px;
          display: flex;
          gap: 20px;
          padding: 24px;
          border-radius: 34px;
          background: rgba(58, 58, 60, 0.92);
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        .s-app {
          position: relative;
          flex: none;
          width: 72px;
          height: 72px;
          border-radius: 18px;
          background: linear-gradient(180deg, #2cc7de, #0c9db4);
        }
        .s-app svg {
          position: absolute;
          left: 18px;
          top: 18px;
        }
        .s-ntext {
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 0;
        }
        .s-ntext span {
          display: block;
          white-space: nowrap;
        }
        .s-nhead {
          font-size: 23px;
          font-weight: 600;
          color: #aeaeb2;
        }
        .s-ntitle {
          font-size: 30px;
          font-weight: 700;
        }
        .s-nbody {
          font-size: 28px;
          font-weight: 500;
          color: #d2d2d7;
        }
      </style>

      <div id="s-root" data-composition-id="story" data-width="1080" data-height="1920">
        <!-- Offer first: readable on frame 0 -->
        <div id="s-month" class="s-line">1 Monat SearchPlace</div>
        <div id="s-free" class="s-line s-grad">gratis.</div>
        <div id="s-chipWrap"><span id="s-chip">Code <b>BLACK</b> · 23.–29. November</span></div>

        <div id="s-t0" class="s-title"><span class="s-ln">Eine Suche.</span><span class="s-ln s-grad">Alle Immobilien.</span></div>
        <div id="s-t1" class="s-title"><span class="s-ln">Tippen.</span><span class="s-ln s-gray">Oder einfach sagen.</span></div>
        <div id="s-t2" class="s-title"><span class="s-ln">KI-Suchagenten.</span><span class="s-ln s-gray">Melden neue Treffer.</span></div>

        <div id="s-tiles" data-layout-allow-overflow></div>
        <div id="s-barCam">
          <div class="s-fit">
            <div class="s-shell">
              <div class="s-ring"></div>
              <div class="s-query">
                <span id="s-placeholder">Was suchst du?</span>
                <span id="s-text"></span>
              </div>
              <div id="s-pulse0" class="s-pulse"></div>
              <div id="s-mic" class="s-mic">
                <svg class="s-micsvg" viewBox="0 0 110 110" fill="none">
                  <rect x="38" y="8" width="34" height="58" rx="17" fill="#ffffff" />
                  <path d="M22 50 a33 33 0 0 0 66 0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
                  <path d="M55 84 V100" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
                </svg>
              </div>
              <div id="s-flash"></div>
            </div>
          </div>
        </div>

        <div id="s-agent">
          <span class="s-radar"><span id="s-sweep"></span></span>
          <span class="s-ameta"><span class="s-aname">Suchagent · Hietzing</span><span class="s-acrit">3 Zi · Balkon · bis 1.200 €</span></span>
          <span class="s-live"><i></i>Aktiv</span>
        </div>
        <div id="s-note">
          <span class="s-app">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none"><circle cx="13" cy="13" r="8.5" stroke="#fff" stroke-width="4" /><path d="M19.5 19.5 L27 27" stroke="#fff" stroke-width="4.5" stroke-linecap="round" /></svg>
          </span>
          <span class="s-ntext"><span class="s-nhead">SearchPlace · jetzt</span><span class="s-ntitle">Neuer Treffer für deinen Suchagenten</span><span class="s-nbody">3 Zi · 82 m² · Hietzing · 1.180 €</span></span>
        </div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("s-root");
          const q = (s) => root.querySelector(s);
          const qa = (s) => Array.from(root.querySelectorAll(s));

          const tilesEl = q("#s-tiles");
          const TILES = [];
          [760, 1360].forEach((y, r) => {
            for (let c = 0; c < 5; c++) {
              const i = r * 5 + c;
              TILES.push([152 + c * 194 + (((i * 37) % 30) - 15), y + (((i * 23) % 20) - 10)]);
            }
          });
          TILES.forEach((p, i) => {
            const t = document.createElement("div");
            t.className = "s-tile";
            t.id = "s-tile" + i;
            t.style.left = p[0] + "px";
            t.style.top = p[1] + "px";
            tilesEl.appendChild(t);
          });

          const WORDS = ["Helle", "3-Zimmer-Wohnung", "mit", "Balkon"];
          const textEl = q("#s-text");
          WORDS.forEach((w, i) => {
            const s = document.createElement("span");
            s.className = "s-word";
            s.textContent = w;
            textEl.appendChild(s);
            if (i < WORDS.length - 1) textEl.appendChild(document.createTextNode(" "));
          });

          gsap.set(["#s-chip", "#s-t0 .s-ln", "#s-t1 .s-ln", "#s-t2 .s-ln", ".s-tile", "#s-flash", ".s-word", "#s-agent", "#s-note", "#s-barCam"], { opacity: 0 });

          const tl = gsap.timeline({ paused: true });
          const soft = "power3.out";
          const titleIn = (id, t) =>
            tl.fromTo(id + " .s-ln", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: soft, stagger: 0.08 }, t);
          const titleOut = (id, t) => tl.to(id, { opacity: 0, y: -22, duration: 0.3, ease: "power2.in" }, t);

          // The offer, legible on the very first frame
          tl.fromTo("#s-free", { scale: 1.06 }, { scale: 1, duration: 1.0, ease: soft }, 0);
          tl.fromTo("#s-month", { y: 14 }, { y: 0, duration: 0.8, ease: soft }, 0);
          tl.fromTo("#s-chip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: soft }, 0.35);
          tl.to(["#s-month", "#s-free", "#s-chipWrap"], { opacity: 0, y: -30, duration: 0.35, ease: "power2.in", stagger: 0.03 }, 1.75);

          // 1 · One search, every listing
          titleIn("#s-t0", 2.0);
          tl.fromTo("#s-barCam", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: soft }, 2.05);
          TILES.forEach((p, i) => {
            const order = (i * 3) % 10;
            tl.fromTo("#s-tile" + i, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: soft }, 2.15 + order * 0.025);
            tl.to("#s-tile" + i, { x: 540 - p[0], y: 1103 - p[1], scale: 0.2, opacity: 0, duration: 0.55, ease: "power3.inOut" }, 2.6 + order * 0.015);
          });
          tl.fromTo("#s-flash", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.15);
          tl.to("#s-flash", { opacity: 0, duration: 0.5 }, 3.35);
          titleOut("#s-t0", 3.4);

          // 2 · Type it, or say it
          titleIn("#s-t1", 3.6);
          tl.to("#s-mic", { scale: 0.9, duration: 0.1, ease: "power2.in" }, 3.65);
          tl.to("#s-mic", { scale: 1, duration: 0.4, ease: soft }, 3.76);
          tl.to("#s-placeholder", { opacity: 0, duration: 0.15 }, 3.7);
          tl.fromTo("#s-pulse0", { scale: 1, opacity: 0.75 }, { scale: 1.45, opacity: 0, duration: 0.8, ease: soft }, 3.72);
          qa(".s-word").forEach((w, i) =>
            tl.fromTo(w, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: soft }, 3.85 + i * 0.16)
          );
          titleOut("#s-t1", 4.85);
          tl.to("#s-barCam", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.85);

          // 3 · Agents that keep searching and ping you
          titleIn("#s-t2", 5.05);
          tl.fromTo("#s-agent", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: soft }, 5.1);
          tl.fromTo("#s-sweep", { rotation: 0 }, { rotation: 360, duration: 1.4, ease: "none" }, 5.0);
          tl.fromTo("#s-note", { opacity: 0, y: -40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: soft }, 5.45);
          titleOut("#s-t2", 6.1);
          tl.to(["#s-agent", "#s-note"], { opacity: 0, y: -22, duration: 0.3, ease: "power2.in" }, 6.1);

          window.__timelines["story"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
