    <script>
      (function () {
        // Listings from everywhere: two rows above and two below the meeting point (deterministic offsets)
        const MEET = [540, 718];
        const tilesEl = document.getElementById("tiles");
        const TILES = [];
        [520, 624, 840, 944].forEach((y, r) => {
          for (let c = 0; c < 5; c++) {
            const i = r * 5 + c;
            TILES.push([152 + c * 194 + (((i * 37) % 30) - 15), y + (((i * 23) % 16) - 8)]);
          }
        });
        TILES.forEach((p, i) => {
          const t = document.createElement("div");
          t.className = "tile";
          t.id = "tile" + i;
          t.style.left = p[0] + "px";
          t.style.top = p[1] + "px";
          tilesEl.appendChild(t);
        });

        // Mini trend curve (shape only, no values)
        const PTS = [[28, 236], [72, 214], [112, 224], [152, 170], [184, 150], [212, 96]];
        let d = "M" + PTS[0][0] + " " + PTS[0][1];
        for (let i = 0; i < PTS.length - 1; i++) {
          const p0 = PTS[Math.max(0, i - 1)], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[Math.min(PTS.length - 1, i + 2)];
          const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
          const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
          d += " C" + c1[0] + " " + c1[1] + " " + c2[0] + " " + c2[1] + " " + p2[0] + " " + p2[1];
        }
        const line = document.getElementById("line");
        line.setAttribute("d", d);
        document.getElementById("area").setAttribute("d", d + " L212 262 L28 262 Z");
        const len = line.getTotalLength();
        line.style.strokeDasharray = len;
        const gauge = document.getElementById("gauge");
        const circ = 2 * Math.PI * 76;
        gauge.style.strokeDasharray = circ;

        // Initial states
        gsap.set(["#b1a span", "#b1b span", "#url", "#logo", "#logoCam", "#pulse", "#b2a", "#b2b"], { opacity: 0 });
        gsap.set(["#searchPill", "#gloss", "#searchTxt span", "#aiTxt span", "#placeTxt span"], { opacity: 0 });
        gsap.set("#band", { scaleX: 0 });
        gsap.set("#sweep", { x: -420 });
        gsap.set("#phText", { maxWidth: 0 });
        gsap.set(["#t3 .ln", ".tile", "#flash", "#sources", "#offRow"], { opacity: 0 });
        gsap.set("#offSheen", { x: -260 });
        gsap.set(["#t4 .ln", ".card", "#area"], { opacity: 0 });
        gsap.set("#line", { strokeDashoffset: len });
        gsap.set(["#dot", "#dotRing"], { scale: 0, transformOrigin: "50% 50%" });
        gsap.set(".bar", { scaleY: 0, transformOrigin: "50% 100%" });
        gsap.set("#gauge", { strokeDashoffset: circ });
        gsap.set(["#e1", "#e2", "#e3"], { opacity: 0 });
        gsap.set("#streak", { x: -1200, opacity: 0 });

        const tl = gsap.timeline({ paused: true });
        const soft = "power3.out";
        const streak = (t) => {
          tl.fromTo("#streak", { x: -1200, opacity: 1 }, { x: 1200, opacity: 1, duration: 0.42, ease: "power2.inOut" }, t);
          tl.set("#streak", { opacity: 0 }, t + 0.43);
        };
        const glowPulse = (t) => {
          tl.to("#glow", { scale: 1.12, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          tl.to("#glow", { scale: 1, opacity: 0.85, duration: 0.9, ease: "power2.inOut" }, t + 0.35);
        };
        const titleIn = (id, t) =>
          tl.fromTo(id + " .ln", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: soft, stagger: 0.1 }, t);
        const out = (targets, t) => tl.to(targets, { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo("#glow", { opacity: 0.85, scale: 1 }, { opacity: 0.85, scale: 1, duration: 0.01 }, 0);

        // ---------- 1 · BLACK WEEK ----------
        tl.fromTo("#b1a span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.12);
        tl.fromTo("#b1b span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.32);
        tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        glowPulse(0.3);
        tl.to("#b1", { scale: 1.08, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 1.6);
        tl.to("#url", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.6);

        // ---------- 2 · "Was suchst du?" ----------
        streak(1.72);
        tl.fromTo("#logoCam", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: soft }, 1.85);
        tl.to("#phText", { maxWidth: 640, duration: 0.8, ease: "power1.inOut" }, 2.2);
        [3.1, 3.35].forEach((t, k) => tl.to("#caret", { opacity: k ? 1 : 0, duration: 0.02 }, t));
        tl.to("#mic", { scale: 0.9, duration: 0.12, ease: "power2.in" }, 2.85);
        tl.to("#mic", { scale: 1, duration: 0.4, ease: soft }, 2.97);
        tl.fromTo("#pulse", { scale: 1, opacity: 0.8 }, { scale: 1.45, opacity: 0, duration: 0.7, ease: soft }, 2.9);

        // ---------- 3 · … and it becomes the logo ----------
        const M = 3.45;
        tl.to("#ph", { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, M);
        tl.to("#micIcon", { scale: 0.5, opacity: 0, duration: 0.3, ease: "power2.in" }, M + 0.05);
        tl.to("#mic", { width: 310, duration: 0.6, ease: "power3.inOut" }, M + 0.15);
        tl.fromTo("#searchPill", { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, M + 0.2);
        tl.fromTo("#band", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, M + 0.45);
        tl.fromTo("#searchTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.04 }, M + 0.4);
        tl.fromTo("#aiTxt span", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.07 }, M + 0.5);
        tl.fromTo("#placeTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.04 }, M + 0.6);
        tl.fromTo("#gloss", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: soft }, M + 0.75);
        tl.to("#sweep", { x: 1800, duration: 0.9, ease: "power2.inOut" }, M + 0.85);
        glowPulse(M + 0.6);

        // the logo rises to the top and stays there (the PNG takes over once it has landed)
        tl.to("#logoCam", { y: -358, scale: 0.446809, duration: 0.8, ease: "power3.inOut" }, 4.9);
        tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 5.68);
        tl.to("#logoCam", { opacity: 0, duration: 0.02 }, 5.9);

        // ---------- 4 · 1 Monat gratis. ----------
        tl.fromTo("#b2a", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 5.55);
        tl.fromTo("#b2b", { opacity: 0, scale: 1.25, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 5.7);
        glowPulse(5.7);
        tl.to("#b2", { scale: 1.08, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 7.0);

        // ---------- 5 · Alle Immobilien. Eine Suche. Auch Off-Market. ----------
        titleIn("#t3", 7.25);
        TILES.forEach((p, i) => {
          const order = (i * 7) % 20;
          tl.fromTo("#tile" + i, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 7.4 + order * 0.018);
          tl.to("#tile" + i, { x: MEET[0] - p[0], y: MEET[1] - p[1], scale: 0.2, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 8.05 + order * 0.012);
        });
        tl.fromTo("#flash", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 8.6);
        tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 8.9);
        tl.fromTo("#sources", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: soft }, 8.7);
        glowPulse(8.6);
        tl.fromTo("#offRow", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 9.3);
        tl.to("#offSheen", { x: 760, duration: 0.8, ease: "power2.inOut" }, 9.7);
        out(["#t3", "#sources", "#offRow"], 10.6);

        // ---------- 6 · Markttrends. Analysen & Rendite. ----------
        titleIn("#t4", 10.97);
        ["#c1", "#c2", "#c3"].forEach((c, k) =>
          tl.fromTo(c, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: soft }, 11.1 + k * 0.1)
        );
        tl.to("#line", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 11.35);
        tl.to("#area", { opacity: 1, duration: 0.5, ease: "power2.out" }, 11.7);
        tl.to("#dot", { scale: 1, duration: 0.3, ease: soft }, 12.12);
        tl.fromTo("#dotRing", { scale: 1, opacity: 0.8 }, { scale: 2.4, opacity: 0, duration: 0.7, ease: soft }, 12.16);
        [0, 1, 2, 3, 4].forEach((b) =>
          tl.to("#bar" + b, { scaleY: 1, duration: 0.55, ease: "power3.out" }, 11.6 + b * 0.08)
        );
        tl.to("#gauge", { strokeDashoffset: circ * 0.28, duration: 0.9, ease: "power2.inOut" }, 11.9);
        out(["#t4", "#c1", "#c2", "#c3"], 13.55);

        // ---------- 7 · Jetzt gratis testen. Bis 29.11. auf SearchPlace.ai ----------
        streak(13.7);
        tl.fromTo("#e1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 13.85);
        tl.fromTo("#e2", { opacity: 0, scale: 1.25, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 14.0);
        tl.fromTo("#e3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: soft }, 14.3);
        glowPulse(14.0);

        // fade to black, so the loop lands cleanly back on BLACK WEEK
        tl.to(["#e1", "#e2", "#e3", "#logo"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 16.5);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
