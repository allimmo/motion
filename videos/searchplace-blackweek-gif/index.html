<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>SearchPlace.ai — Black Week GIF</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Josefin Sans";
        src: url("assets/fonts/josefin-sans-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: "Inter", sans-serif;
        color: #f5f5f7;
      }
      #glow {
        position: absolute;
        left: 90px;
        top: 110px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(18, 180, 205, 0.2) 0%, rgba(18, 180, 205, 0.06) 42%, rgba(18, 180, 205, 0) 68%);
      }
      #logo {
        position: absolute;
        left: 330px;
        top: 64px;
        width: 420px;
        height: 106px;
      }
      #logo img {
        display: block;
        width: 420px;
        height: 106px;
      }
      #url {
        position: absolute;
        left: 0;
        right: 0;
        top: 958px;
        text-align: center;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #d2d2d7;
      }
      .grad {
        color: #6fe3f3;
        background: linear-gradient(100deg, #b8f6ff 0%, #6fe3f3 35%, #12b4cd 70%, #2f86c9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .beat {
        position: absolute;
        inset: 0;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        line-height: 1;
      }
      .row span {
        display: block;
      }

      /* beat 1 */
      #b1a {
        top: 330px;
        font-size: 210px;
        font-weight: 900;
        letter-spacing: -0.045em;
      }
      #b1b {
        top: 540px;
        font-size: 210px;
        font-weight: 900;
        letter-spacing: -0.045em;
      }
      #b1b span {
        padding-bottom: 14px;
      }

      /* beat 2 */
      #b2a {
        top: 360px;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      #b2b {
        top: 470px;
        font-size: 228px;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      #b2b span {
        padding-bottom: 18px;
      }

      /* beat 3 */
      #ticket {
        position: absolute;
        left: 190px;
        top: 350px;
        width: 700px;
        height: 260px;
        border-radius: 40px;
        border: 3px solid #12b4cd;
        background: rgba(18, 180, 205, 0.08);
        box-shadow: 0 0 80px rgba(18, 180, 205, 0.25);
        overflow: hidden;
      }
      #ticketLabel {
        position: absolute;
        left: 0;
        right: 0;
        top: 42px;
        text-align: center;
        padding-left: 0.3em;
        font-family: "Josefin Sans", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.3em;
        color: #aeaeb2;
      }
      #code {
        position: absolute;
        left: 0;
        right: 0;
        top: 96px;
        display: flex;
        justify-content: center;
        padding-left: 0.14em;
        font-size: 136px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.14em;
      }
      #code span {
        display: block;
      }
      #sheen {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 260px;
        background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.28) 50%, transparent 100%);
      }
      #until {
        position: absolute;
        left: 0;
        right: 0;
        top: 664px;
        text-align: center;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #until b {
        font-weight: 700;
        color: #6fe3f3;
      }

      /* light streak on each change */
      #streak {
        position: absolute;
        left: 0;
        top: 552px;
        width: 1080px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(111, 227, 243, 0) 0%, rgba(184, 246, 255, 0.95) 50%, rgba(111, 227, 243, 0) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">
      <div id="glow" data-layout-allow-overflow></div>
      <div id="logo"><img src="assets/logo.png" alt="SearchPlace AI" /></div>

      <div id="b1" class="beat">
        <div id="b1a" class="row"><span>B</span><span>L</span><span>A</span><span>C</span><span>K</span></div>
        <div id="b1b" class="row"><span class="grad">W</span><span class="grad">E</span><span class="grad">E</span><span class="grad">K</span></div>
      </div>

      <div id="b2" class="beat">
        <div id="b2a" class="row"><span>1 Monat</span></div>
        <div id="b2b" class="row"><span class="grad">gratis.</span></div>
      </div>

      <div id="b3" class="beat">
        <div id="ticket">
          <div id="ticketLabel">CODE FÜR 1 MONAT GRATIS</div>
          <div id="code"><span>B</span><span>L</span><span>A</span><span>C</span><span>K</span></div>
          <div id="sheen" data-layout-allow-overflow></div>
        </div>
        <div id="until">Nur bis <b>29. November</b></div>
      </div>

      <div id="streak" data-layout-allow-overflow></div>
      <div id="url">searchplace.ai</div>
    </div>

    <script>
      (function () {
        gsap.set(["#b1a span", "#b1b span", "#b2a", "#b2b", "#ticket", "#code span", "#until"], { opacity: 0 });
        gsap.set("#streak", { x: -1200, opacity: 0 });
        gsap.set("#sheen", { x: -320 });

        const tl = gsap.timeline({ paused: true });
        const soft = "power3.out";
        const streak = (t) => {
          tl.fromTo("#streak", { x: -1200, opacity: 1 }, { x: 1200, opacity: 1, duration: 0.42, ease: "power2.inOut" }, t);
          tl.set("#streak", { opacity: 0 }, t + 0.43);
        };
        const glowPulse = (t) => {
          tl.to("#glow", { scale: 1.12, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          tl.to("#glow", { scale: 1, opacity: 0.85, duration: 0.9, ease: "power2.inOut" }, t + 0.35);
        };
        tl.fromTo("#glow", { opacity: 0.85, scale: 1 }, { opacity: 0.85, scale: 1, duration: 0.01 }, 0);

        // 1 — BLACK WEEK
        tl.fromTo("#b1a span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.12);
        tl.fromTo("#b1b span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.32);
        glowPulse(0.3);
        tl.to("#b1", { scale: 1.08, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 1.6);

        // 2 — 1 Monat gratis.
        streak(1.72);
        tl.fromTo("#b2a", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 1.85);
        tl.fromTo("#b2b", { opacity: 0, scale: 1.25, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 2.0);
        glowPulse(2.0);
        tl.to("#b2", { scale: 1.08, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 3.3);

        // 3 — the code
        streak(3.42);
        tl.fromTo("#ticket", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "expo.out" }, 3.55);
        tl.fromTo("#code span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: soft, stagger: 0.06 }, 3.7);
        tl.fromTo("#until", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: soft }, 3.95);
        tl.to("#sheen", { x: 1000, duration: 0.7, ease: "power2.inOut" }, 4.3);
        glowPulse(3.6);
        tl.to("#b3", { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" }, 5.45);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
