      html,
      body {
        width: 1080px;

        top: 958px;

        letter-spacing: -0.01em;

      .grad {

        background-clip: text;
        -webkit-text-fill-color: transparent;

      .beat {
        position: absolute;

      /* ---------- 1 · BLACK WEEK ---------- */
      #b1a {

      /* ---------- 2/3 · search bar → logo (logo units 1650 × 415) ---------- */

      /* ---------- 4 · one search, every listing ---------- */
      #tiles {

        position: absolute;
        left: 0;

        content: "";

      .tile::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 68px;
        width: 64px;
        height: 8px;

        background: #48484a;

      #flash {
        position: absolute;
        left: 240px;

      #chart {

      #trend {

        padding: 0 20px;
        border-radius: 999px;
        background: rgba(18, 180, 205, 0.16);
        color: #b8f6ff;
        font-size: 30px;
        font-weight: 600;
      }
      #svg {
        position: absolute;

      /* ---------- 6 · the offer ---------- */
      #e1 {
        top: 368px;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      #e2 {
        top: 478px;
        font-size: 228px;

        letter-spacing: -0.05em;
      }
      #e2 span {
        padding-bottom: 18px;
      }
      #e3 {
        top: 798px;
        font-size: 56px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #d2d2d7;
      }
      #e3 b {
        font-weight: 700;

      }

      /* light streak on a scene change */
      #streak {
        position: absolute;
        left: 0;
        top: 538px;
        width: 1080px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(111, 227, 243, 0) 0%, rgba(184, 246, 255, 0.95) 50%, rgba(111, 227, 243, 0) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.5" data-width="1080" data-height="1080">
      <div id="glow" data-layout-allow-overflow></div>

      <!-- 1 · BLACK WEEK -->
      <div id="b1" class="beat">
        <div id="b1a" class="row"><span>B</span><span>L</span><span>A</span><span>C</span><span>K</span></div>
        <div id="b1b" class="row"><span class="grad">W</span><span class="grad">E</span><span class="grad">E</span><span class="grad">K</span></div>
      </div>
      <div id="url">searchplace.ai</div>

      <!-- 2/3 · the search bar, which becomes the logo -->
      <div id="logoCam">
        <div class="fit">
          <div class="shell">
            <div id="gloss"></div>
            <div class="ring"></div>
            <div id="ph"><span id="phText" data-layout-allow-overflow>Was suchst du?</span><span id="caret"></span></div>
            <div id="band">
              <div id="placeTxt" class="lg" data-layout-ignore><span>P</span><span>L</span><span>A</span><span>C</span><span>E</span></div>
            </div>
            <div id="searchPill" class="pill" data-layout-allow-overflow>
              <div id="searchTxt" class="lg" data-layout-ignore><span>S</span><span>E</span><span>A</span><span>R</span><span>C</span><span>H</span></div>
            </div>
            <div id="pulse"></div>
            <div id="mic" class="pill">
              <svg id="micIcon" class="micsvg" viewBox="0 0 110 110" fill="none">
                <rect x="38" y="8" width="34" height="58" rx="17" fill="#ffffff" />
                <path d="M22 50 a33 33 0 0 0 66 0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
                <path d="M55 84 V100" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
              </svg>
              <div id="aiTxt" class="lg" data-layout-ignore><span>A</span><span>I</span></div>
            </div>
            <div id="sweep" data-layout-allow-overflow></div>
          </div>
        </div>
      </div>
      <div id="logoImg"><img src="assets/logo.png" alt="SearchPlace AI" /></div>

      <!-- 4 · one search, every listing -->
      <div id="t4" class="title"><span class="ln">Eine Suche.</span><span class="ln grad">Alle Immobilien.</span></div>
      <div id="tiles" data-layout-allow-overflow></div>
      <div id="flash" data-layout-allow-overflow></div>
      <div id="sources">Portale · Makler · Bauträger</div>

      <!-- 5 · market trends & analyses (illustrative curve, no values) -->
      <div id="t5" class="title"><span class="ln">Markttrends.</span><span class="ln grad">Und Analysen.</span></div>
      <div id="chart">
        <div id="chartHead">
          <span id="chartTitle">Preisentwicklung</span>
          <span id="trend">
            <svg width="28" height="28" viewBox="0 0 26 26" fill="none">
              <path d="M3 20 L11 12 L15 16 L23 6" stroke="#6fe3f3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M16 6 H23 V13" stroke="#6fe3f3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Trend
          </span>
        </div>
        <svg id="svg" viewBox="0 0 820 440" fill="none">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#12b4cd" stop-opacity="0.32" />
              <stop offset="1" stop-color="#12b4cd" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#12b4cd" />
              <stop offset="1" stop-color="#b8f6ff" />
            </linearGradient>
          </defs>
          <g stroke="rgba(255,255,255,0.07)" stroke-width="2">
            <line x1="0" y1="40" x2="820" y2="40" />
            <line x1="0" y1="140" x2="820" y2="140" />
            <line x1="0" y1="240" x2="820" y2="240" />
            <line x1="0" y1="340" x2="820" y2="340" />
          </g>
          <path id="area" fill="url(#areaGrad)" />
          <path id="line" stroke="url(#lineGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          <circle id="dotRing" cx="790" cy="120" r="13" stroke="#b8f6ff" stroke-width="3" />
          <circle id="dot" cx="790" cy="120" r="12" fill="#b8f6ff" stroke="#1c1c1e" stroke-width="4" />
          <g id="months" fill="#98989d" font-family="Inter, sans-serif" font-size="32" font-weight="600" text-anchor="middle"></g>
        </svg>
      </div>

      <!-- 6 · the offer -->
      <div id="e1" class="row"><span>1 Monat</span></div>
      <div id="e2" class="row"><span class="grad">gratis.</span></div>
      <div id="e3" class="row"><span>auf <b>SearchPlace.ai</b></span></div>

      <div id="streak" data-layout-allow-overflow></div>
    </div>

    <script>
      (function () {
        const SVGNS = "http://www.w3.org/2000/svg";

        // Listings from everywhere: two rows above and two below the meeting point (deterministic offsets)
        const MEET = [540, 750];
        const tilesEl = document.getElementById("tiles");
        const TILES = [];
        [548, 652, 852, 956].forEach((y, r) => {
          for (let c = 0; c < 5; c++) {
            const i = r * 5 + c;
            TILES.push([152 + c * 194 + (((i * 37) % 30) - 15), y + (((i * 23) % 16) - 8)]);
          }
        });
        TILES.forEach((p, i) => {
          const t = document.createElement("div");
          t.className = "tile";
          t.id = "tile" + i;
          t.style.left = p[0] + "px";
          t.style.top = p[1] + "px";
          tilesEl.appendChild(t);
        });

        // Trend curve: smooth line through illustrative points (shape only, no values shown)
        const PTS = [[30, 300], [182, 262], [334, 276], [486, 210], [638, 182], [790, 120]];
        let d = "M" + PTS[0][0] + " " + PTS[0][1];
        for (let i = 0; i < PTS.length - 1; i++) {
          const p0 = PTS[Math.max(0, i - 1)], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[Math.min(PTS.length - 1, i + 2)];
          const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
          const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
          d += " C" + c1[0] + " " + c1[1] + " " + c2[0] + " " + c2[1] + " " + p2[0] + " " + p2[1];
        }
        const line = document.getElementById("line");
        line.setAttribute("d", d);
        document.getElementById("area").setAttribute("d", d + " L790 340 L30 340 Z");
        const len = line.getTotalLength();
        line.style.strokeDasharray = len;
        const months = document.getElementById("months");
        ["Jun", "Jul", "Aug", "Sep", "Okt", "Nov"].forEach((m, i) => {
          const t = document.createElementNS(SVGNS, "text");
          t.setAttribute("x", PTS[i][0]);
          t.setAttribute("y", 410);
          t.textContent = m;
          months.appendChild(t);
        });

        // Initial states
        gsap.set(["#b1a span", "#b1b span", "#url", "#logoCam", "#logoImg", "#pulse"], { opacity: 0 });
        gsap.set(["#searchPill", "#gloss", "#searchTxt span", "#aiTxt span", "#placeTxt span"], { opacity: 0 });
        gsap.set("#band", { scaleX: 0 });
        gsap.set("#sweep", { x: -420 });
        gsap.set("#phText", { maxWidth: 0 });
        gsap.set(["#t4 .ln", ".tile", "#flash", "#sources", "#t5 .ln", "#chart", "#area"], { opacity: 0 });
        gsap.set(["#dot", "#dotRing"], { scale: 0, transformOrigin: "50% 50%" });
        gsap.set("#line", { strokeDashoffset: len });
        gsap.set(["#e1", "#e2", "#e3"], { opacity: 0 });
        gsap.set("#streak", { x: -1200, opacity: 0 });

        const tl = gsap.timeline({ paused: true });
        const soft = "power3.out";
        const streak = (t) => {
          tl.fromTo("#streak", { x: -1200, opacity: 1 }, { x: 1200, opacity: 1, duration: 0.42, ease: "power2.inOut" }, t);
          tl.set("#streak", { opacity: 0 }, t + 0.43);
        };
        const glowPulse = (t) => {
          tl.to("#glow", { scale: 1.12, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          tl.to("#glow", { scale: 1, opacity: 0.85, duration: 0.9, ease: "power2.inOut" }, t + 0.35);
        };
        const titleIn = (id, t) =>
          tl.fromTo(id + " .ln", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: soft, stagger: 0.1 }, t);
        const out = (targets, t) => tl.to(targets, { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo("#glow", { opacity: 0.85, scale: 1 }, { opacity: 0.85, scale: 1, duration: 0.01 }, 0);

        // ---------- 1 · BLACK WEEK ----------
        tl.fromTo("#b1a span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.12);
        tl.fromTo("#b1b span", { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.32);
        tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        glowPulse(0.3);
        tl.to("#b1", { scale: 1.08, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 1.6);
        tl.to("#url", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.6);

        // ---------- 2 · "Was suchst du?" ----------
        streak(1.72);
        tl.fromTo("#logoCam", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: soft }, 1.85);
        tl.to("#phText", { maxWidth: 640, duration: 0.8, ease: "power1.inOut" }, 2.2);
        [3.1, 3.35].forEach((t, k) => tl.to("#caret", { opacity: k ? 1 : 0, duration: 0.02 }, t));
        tl.to("#mic", { scale: 0.9, duration: 0.12, ease: "power2.in" }, 2.85);
        tl.to("#mic", { scale: 1, duration: 0.4, ease: soft }, 2.97);
        tl.fromTo("#pulse", { scale: 1, opacity: 0.8 }, { scale: 1.45, opacity: 0, duration: 0.7, ease: soft }, 2.9);

        // ---------- 3 · … and it becomes the logo ----------
        const M = 3.45;
        tl.to("#ph", { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, M);
        tl.to("#micIcon", { scale: 0.5, opacity: 0, duration: 0.3, ease: "power2.in" }, M + 0.05);
        tl.to("#mic", { width: 310, duration: 0.6, ease: "power3.inOut" }, M + 0.15);
        tl.fromTo("#searchPill", { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, M + 0.2);
        tl.fromTo("#band", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, M + 0.45);
        tl.fromTo("#searchTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.04 }, M + 0.4);
        tl.fromTo("#aiTxt span", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.07 }, M + 0.5);
        tl.fromTo("#placeTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: soft, stagger: 0.04 }, M + 0.6);
        tl.fromTo("#gloss", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: soft }, M + 0.75);
        tl.to("#sweep", { x: 1800, duration: 0.9, ease: "power2.inOut" }, M + 0.85);
        glowPulse(M + 0.6);

        // the logo rises to the top and stays there
        tl.to("#logoCam", { y: -358, scale: 0.446809, duration: 0.8, ease: "power3.inOut" }, 4.9);
        tl.fromTo("#logoImg", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 5.68);
        tl.to("#logoCam", { opacity: 0, duration: 0.02 }, 5.9);

        // ---------- 4 · Eine Suche. Alle Immobilien. ----------
        titleIn("#t4", 5.45);
        TILES.forEach((p, i) => {
          const order = (i * 7) % 20;
          tl.fromTo("#tile" + i, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 5.6 + order * 0.018);
          tl.to("#tile" + i, { x: MEET[0] - p[0], y: MEET[1] - p[1], scale: 0.2, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 6.25 + order * 0.012);
        });
        tl.fromTo("#flash", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 6.8);
        tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 7.1);
        tl.fromTo("#sources", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: soft }, 6.9);
        glowPulse(6.8);
        out(["#t4", "#sources"], 7.85);

        // ---------- 5 · Markttrends. Und Analysen. ----------
        titleIn("#t5", 8.22);
        tl.fromTo("#chart", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: soft }, 8.3);
        tl.to("#line", { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 8.5);
        tl.to("#area", { opacity: 1, duration: 0.6, ease: "power2.out" }, 8.9);
        tl.to("#dot", { scale: 1, duration: 0.3, ease: soft }, 9.42);
        tl.fromTo("#dotRing", { scale: 1, opacity: 0.8 }, { scale: 2.4, opacity: 0, duration: 0.7, ease: soft }, 9.47);
        out(["#t5", "#chart"], 10.15);

        // ---------- 6 · 1 Monat gratis auf SearchPlace.ai ----------
        streak(10.3);
        tl.fromTo("#e1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: soft }, 10.45);
        tl.fromTo("#e2", { opacity: 0, scale: 1.25, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 10.6);
        tl.fromTo("#e3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: soft }, 10.9);
        glowPulse(10.6);

        // fade to black, so the loop lands cleanly back on BLACK WEEK
        tl.to(["#e1", "#e2", "#e3", "#logoImg"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 13.1);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
