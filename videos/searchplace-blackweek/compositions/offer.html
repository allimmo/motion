      <script>
        (function () {
          gsap.set("#o-sheen", { x: -320 });
          const tl = gsap.timeline({ paused: true });
          const soft = "power3.out";

          // The card arrives like a product shot, then turns slowly in the light
          tl.fromTo("#o-card", { opacity: 0, y: 120, rotationX: 28, scale: 0.94 }, { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 1.3, ease: soft }, 0.15);
          tl.fromTo("#o-turn", { rotationY: -7 }, { rotationY: 6, duration: 6.2, ease: "sine.inOut" }, 0.15);
          tl.to("#o-sheen", { x: 1000, duration: 1.2, ease: "power2.inOut" }, 1.35);

          // Same words as the opening — the line people should remember
          tl.fromTo("#o-month", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: soft }, 1.0);
          tl.fromTo("#o-gift", { opacity: 0, y: 26, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: soft }, 1.3);
          tl.fromTo(["#o-terms", "#o-terms2"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: soft, stagger: 0.12 }, 2.1);
          tl.fromTo("#o-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: soft }, 2.7);
          tl.fromTo("#o-miss", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: soft }, 3.2);

          window.__timelines["offer"] = tl;
        })();
