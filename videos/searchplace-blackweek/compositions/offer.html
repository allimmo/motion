          // 1 — the search bar returns, alone in the dark

          // 2 — and becomes the logo

          tl.to("#o-micIcon", { scale: 0.5, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.8);
          tl.to("#o-mic", { width: 310, duration: 0.7, ease: "power3.inOut" }, 0.95);
          tl.fromTo("#o-search", { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 1.05);
          tl.fromTo("#o-band", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 1.35);
          tl.fromTo("#o-searchTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: soft, stagger: 0.05 }, 1.3);
          tl.fromTo("#o-aiTxt span", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: soft, stagger: 0.08 }, 1.45);
          tl.fromTo("#o-placeTxt span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: soft, stagger: 0.05 }, 1.6);
          tl.fromTo("#o-gloss", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: soft }, 1.8);
          tl.to("#o-sweep", { x: 1800, duration: 1.1, ease: "power2.inOut" }, 2.0);

          // 3 — logo rises; the offer, quietly
          tl.to("#o-logoCam", { y: -271, scale: 0.82, duration: 1.1, ease: "power3.inOut" }, 2.75);
          tl.fromTo("#o-month", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: soft }, 3.35);
          tl.fromTo("#o-gift", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: soft }, 3.55);
          tl.fromTo("#o-codeBox", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: soft }, 4.2);
          tl.to("#o-codeSheen", { x: 700, duration: 1.2, ease: "power2.inOut" }, 4.8);
          tl.fromTo("#o-when", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: soft }, 4.75);
          tl.fromTo("#o-url", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: soft }, 5.15);

          window.__timelines["offer"] = tl;
