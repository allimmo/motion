      <script>
        (function () {
          const UNIT = "BLACK WEEK  •  1 MONAT GRATIS  •  CODE BLACK  •  23.–29.11.  •  ";
          document.getElementById("o-trackTop").textContent = UNIT.repeat(5);
          document.getElementById("o-trackBot").textContent = UNIT.repeat(5);

          gsap.set("#o-shine", { x: -300 });
          gsap.set("#o-missLine", { scaleX: 0 });

          const tl = gsap.timeline({ paused: true });
          const P3 = "power3.out";

          tl.fromTo(["#o-bandTop", "#o-bandBot"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, 0.05);
          tl.fromTo("#o-trackTop", { x: 0 }, { x: -1600, duration: 5.85, ease: "none" }, 0);
          tl.fromTo("#o-trackBot", { x: -1600 }, { x: 0, duration: 5.85, ease: "none" }, 0);

          tl.fromTo("#o-logo", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "expo.out" }, 0.08);
          tl.fromTo("#o-month span", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: P3, stagger: 0.035 }, 0.3);
          tl.fromTo("#o-free span", { opacity: 0, scale: 1.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.045 }, 0.5);

          tl.fromTo("#o-ticket", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.55, ease: "expo.out" }, 1.1);
          tl.fromTo("#o-code span", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: P3, stagger: 0.06 }, 1.25);
          tl.to("#o-shine", { x: 900, duration: 0.75, ease: "power2.inOut" }, 1.95);
          tl.fromTo("#o-valid", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: P3 }, 1.8);
          tl.fromTo("#o-url", { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: P3 }, 2.2);
          tl.fromTo("#o-miss", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 2.65);
          tl.to("#o-missLine", { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 2.9);

          window.__timelines["offer"] = tl;
        })();
