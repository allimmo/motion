      <script>
        (function () {
          const root = document.getElementById("r-root");
          const q = (s) => root.querySelector(s);
          const qa = (s) => Array.from(root.querySelectorAll(s));

          // Spoken query, word by word ("bis 1.100 €" stays together)
          const WORDS = ["Ruhige", "2-Zimmer-Wohnung", "mit", "Balkon", "in", "Neubau,", "bis 1.100 €"];
          const textEl = q("#r-text");
          WORDS.forEach((w, i) => {
            const s = document.createElement("span");
            s.className = "r-word";
            s.textContent = w;
            textEl.appendChild(s);
            if (i < WORDS.length - 1) textEl.appendChild(document.createTextNode(" "));
          });

          // Mini waveform in the "Hört zu" status
          const wave = q("#r-wave");
          for (let i = 0; i < 12; i++) wave.appendChild(document.createElement("i"));

          // Result rows (illustrative listings)
          const ROWS = [
            ["1.050 €", "2 Zi · 58 m² · Balkon · ruhig", true],
            ["990 €", "2 Zi · 52 m² · Balkon · Hofseite", false],
            ["1.090 €", "2 Zi · 61 m² · Balkon · Altbau", false],
          ];
          const rowsEl = q("#r-rows");
          ROWS.forEach(([price, spec, top], i) => {
            const r = document.createElement("div");
            r.className = "r-row";
            r.id = "r-row" + i;
            r.innerHTML =
              '<span class="r-thumb"></span><span class="r-price">' + price + '</span><span class="r-spec">' + spec + "</span>" +
              (top ? '<span class="r-badge">Top-Treffer</span>' : "");
            rowsEl.appendChild(r);
          });

          const tl = gsap.timeline({ paused: true });
          const P3 = "power3.out";
          const fields = qa(".r-field");
          const ticks = qa(".r-tick");

          // ---------- Intro ----------
          tl.fromTo("#r-panelA", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: P3 }, 0.1);
          tl.fromTo(["#r-panelB", "#r-barCam", "#r-headB"], { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: P3 }, 0.2);
          tl.fromTo("#r-vs", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: P3 }, 0.7);
          gsap.set("#r-barCam", { scale: 0.93617 });

          // Status token cycles
          const tokSeq = (ids, times) => {
            ids.forEach((id, n) => {
              tl.set(id, { opacity: 1 }, times[n]);
              if (n > 0) tl.set(ids[n - 1], { opacity: 0 }, times[n]);
            });
          };
          tokSeq(["#r-ta0", "#r-ta1", "#r-ta2", "#r-ta1", "#r-ta2"], [1.0, 4.9, 5.6, 8.8, 9.3]);
          tokSeq(["#r-tb0", "#r-tb1", "#r-tb2", "#r-tb3"], [1.0, 2.45, 5.6, 7.35]);

          // ---------- Panel A: cursor fights the filters ----------
          tl.fromTo("#r-handM", { rotation: 0 }, { rotation: 360 * 14, duration: 11.5, ease: "none" }, 1.0);
          tl.fromTo("#r-handH", { rotation: 30 }, { rotation: 30 + 360 * 1.2, duration: 11.5, ease: "none" }, 1.0);
          gsap.set(["#r-resBusy", "#r-res0", "#r-res3"], { opacity: 0 });
          gsap.set("#r-toast", { opacity: 0 });
          gsap.set("#r-ripple", { opacity: 0 });

          const P = {
            bezirk: [250, 201],
            zimmer: [710, 201],
            bis: [710, 287],
            balkon: [44, 360],
            suchen: [822, 447],
            tabB: [340, 118],
            tabC: [552, 118],
          };
          tl.fromTo("#r-cursor", { x: 600, y: 540, opacity: 0 }, { x: 600, y: 540, opacity: 1, duration: 0.3 }, 0.95);
          const move = (to, t, d) => tl.to("#r-cursor", { x: to[0], y: to[1], duration: d || 0.38, ease: "power2.inOut" }, t);
          const click = (t) => {
            tl.to("#r-cursor svg", { scale: 0.84, duration: 0.08, ease: "power2.in", transformOrigin: "10% 5%" }, t);
            tl.to("#r-cursor svg", { scale: 1, duration: 0.25, ease: P3 }, t + 0.08);
            tl.fromTo("#r-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.4, opacity: 0, duration: 0.45, ease: P3 }, t);
          };
          const fill = (i, t) => {
            tl.set(fields[i].querySelector(".r-ph"), { opacity: 0 }, t);
            tl.set(fields[i].querySelector(".r-val"), { opacity: 1 }, t);
            tl.fromTo(fields[i], { borderColor: "#6c8a96" }, { borderColor: "#2f3f48", duration: 0.5 }, t);
          };
          const resetForm = (t) => {
            fields.forEach((f) => {
              tl.set(f.querySelector(".r-ph"), { opacity: 1 }, t);
              tl.set(f.querySelector(".r-val"), { opacity: 0 }, t);
            });
            tl.set(ticks[0], { opacity: 0 }, t);
            tl.set(["#r-resBusy", "#r-res0", "#r-res3"], { opacity: 0 }, t);
            tl.fromTo(".r-form, .r-checks", { opacity: 0.25 }, { opacity: 1, duration: 0.35 }, t);
          };
          const round = (t0, speed, result) => {
            const s = speed;
            move(P.bezirk, t0, 0.42 * s); click(t0 + 0.42 * s); fill(0, t0 + 0.45 * s);
            move(P.zimmer, t0 + 0.62 * s, 0.36 * s); click(t0 + 0.98 * s); fill(1, t0 + 1.0 * s);
            move(P.bis, t0 + 1.18 * s, 0.32 * s); click(t0 + 1.5 * s); fill(3, t0 + 1.52 * s);
            move(P.balkon, t0 + 1.7 * s, 0.36 * s); click(t0 + 2.06 * s); tl.set(ticks[0], { opacity: 1 }, t0 + 2.08 * s);
            move(P.suchen, t0 + 2.26 * s, 0.4 * s); click(t0 + 2.66 * s);
            tl.set("#r-resBusy", { opacity: 1 }, t0 + 2.7 * s);
            tl.set("#r-resBusy", { opacity: 0 }, t0 + 3.25 * s);
            tl.set(result, { opacity: 1 }, t0 + 3.25 * s);
            tl.fromTo(result, { x: -16 }, { x: 0, duration: 0.3, ease: P3 }, t0 + 3.25 * s);
          };
          round(1.25, 1, "#r-res0");
          move(P.tabB, 4.85, 0.4); click(5.25);
          tl.to("#r-tabInd", { x: 212, duration: 0.3, ease: "power3.inOut" }, 5.27);
          resetForm(5.3);
          round(5.55, 0.82, "#r-res3");
          move(P.tabC, 8.75, 0.38); click(9.13);
          tl.to("#r-tabInd", { x: 424, duration: 0.3, ease: "power3.inOut" }, 9.15);
          resetForm(9.18);
          move([430, 360], 9.4, 0.4);
          move([640, 360], 9.85, 0.4);
          tl.fromTo("#r-toast", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: P3 }, 10.15);
          move([520, 450], 10.4, 0.6);

          // ---------- Panel B: say it once ----------
          tl.fromTo("#r-placeholder", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
          // tap the mic
          tl.to("#r-mic", { scale: 0.88, duration: 0.1, ease: "power2.in" }, 2.3);
          tl.to("#r-mic", { scale: 1, duration: 0.45, ease: P3 }, 2.42);
          tl.to("#r-placeholder", { opacity: 0, duration: 0.2 }, 2.45);
          for (let k = 0; k < 6; k++) {
            const t = 2.45 + k * 0.5;
            const id = k % 2 ? "#r-pulse1" : "#r-pulse0";
            tl.fromTo(id, { scale: 1, opacity: 0.85 }, { scale: 1.55, opacity: 0, duration: 0.8, ease: P3 }, t);
          }
          // waveform: deterministic sine envelope, 12 bars
          const bars = qa("#r-wave i");
          bars.forEach((b, i) => {
            gsap.set(b, { scaleY: 0.2 });
            for (let k = 0; k < 26; k++) {
              const t = 2.5 + k * 0.12;
              const h = 0.25 + 0.75 * Math.abs(Math.sin(i * 0.9 + k * 1.37) * Math.cos(k * 0.41 + i * 0.3));
              tl.to(b, { scaleY: h, duration: 0.12, ease: "sine.inOut" }, t);
            }
          });
          // live transcription
          qa(".r-word").forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: P3 }, 2.7 + i * 0.38);
          });
          // search the whole market
          tl.fromTo("#r-progress", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.6);
          tl.fromTo("#r-progressFill", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 5.7);
          tl.to("#r-progress", { opacity: 0, duration: 0.3 }, 7.15);
          [0, 1, 2].forEach((i) => {
            tl.fromTo("#r-row" + i, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: P3 }, 7.25 + i * 0.16);
          });
          tl.fromTo("#r-row0", { borderColor: "rgba(111,227,243,0.18)" }, { borderColor: "rgba(111,227,243,0.85)", duration: 0.6, ease: P3 }, 8.4);

          // ---------- Exit: old way drops, bar flies to centre stage ----------
          tl.to("#r-panelA", { opacity: 0.35, duration: 0.5, ease: "power2.out" }, 12.0);
          tl.to("#r-panelA", { y: -720, opacity: 0, duration: 0.8, ease: "power3.in" }, 12.55);
          tl.to("#r-vs", { scale: 0.5, opacity: 0, duration: 0.35, ease: "power3.in" }, 12.4);
          tl.to("#r-rows .r-row", { y: 50, opacity: 0, duration: 0.35, ease: "power3.in", stagger: 0.05 }, 12.85);
          tl.to(["#r-headB", "#r-panelB"], { opacity: 0, duration: 0.45, ease: "power2.in" }, 12.95);
          tl.to("#r-barCam", { x: -30, y: -244, scale: 1, duration: 0.85, ease: "power3.inOut" }, 13.0);
          tl.to("#r-text", { opacity: 0, y: -24, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 13.4);
          tl.to("#r-placeholder", { opacity: 1, duration: 0.25 }, 13.72);

          window.__timelines["race"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
