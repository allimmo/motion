      <div id="s-root" data-composition-id="steps" data-width="1080" data-height="1920">
        <div id="s-kicker">SO FUNKTIONIERT’S</div>
        <div id="s-prog">
          <span class="s-seg"><span id="s-seg0" class="s-segfill"></span></span>
          <span class="s-seg"><span id="s-seg1" class="s-segfill"></span></span>
          <span class="s-seg"><span id="s-seg2" class="s-segfill"></span></span>
        </div>

        <div id="s-t1" class="s-title">
          <span class="s-ln"><span class="s-wd">Tippen</span><span class="s-wd">oder</span></span>
          <span class="s-ln"><span class="s-wd s-accent">sprechen.</span></span>

          <span class="s-ln"><span class="s-wd">Die</span><span class="s-wd">KI</span></span>

        <div id="s-t3" class="s-title">
          <span class="s-ln"><span class="s-wd">Durchsucht</span><span class="s-wd">den</span></span>

        <!-- Step 3 -->
        <div id="s-stream" data-layout-allow-overflow></div>
        <div id="s-sub3" class="s-sub" style="top: 870px">Alle Portale. Gleichzeitig.</div>
        <div id="s-cards" data-layout-allow-overflow></div>

        <div id="s-barCam">
          <div class="s-fit">
            <div class="s-shell">
              <div class="s-ring"></div>
              <div class="s-query">
                <span id="s-placeholder">Tippen oder sprechen …</span>

                <span id="s-spoken"></span>
              </div>

                  <rect x="38" y="8" width="34" height="58" rx="17" fill="#ffffff" />
                  <path d="M22 50 a33 33 0 0 0 66 0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
                  <path d="M55 84 V100" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

      <script>
        (function () {
          const root = document.getElementById("s-root");
          const q = (s) => root.querySelector(s);
          const qa = (s) => Array.from(root.querySelectorAll(s));

          // Typed input (step 1)
          const TYPED = "2 Zimmer mit Balkon, ruhig";
          const typedEl = q("#s-typed");
          const typedChars = [];
          for (const c of TYPED) {
            const s = document.createElement("span");
            s.className = "s-ch";
            s.textContent = c;
            typedEl.appendChild(s);
            typedChars.push(s);
          }
          const caret = document.createElement("span");
          caret.className = "s-caret";
          caret.id = "s-caret";
          typedEl.appendChild(caret);

          // Spoken input (steps 1-3): [text, keyword?, trailing]
          const SPOKEN = [
            ["Ruhige", 1, " "],
            ["2-Zimmer-Wohnung", 1, " "],
            ["mit", 0, " "],
            ["Balkon", 1, " "],
            ["in", 0, " "],
            ["Neubau", 1, ", "],
            ["bis 1.100 €", 1, ""],
          ];
          const spokenEl = q("#s-spoken");
          const words = [];
          const kws = [];
          SPOKEN.forEach(([t, k, trail]) => {
            const w = document.createElement("span");
            w.className = "s-word";
            if (k) {
              const hl = document.createElement("span");
              hl.className = "s-hl";
              w.appendChild(hl);
              kws.push(w);
            }
            w.appendChild(document.createTextNode(t));
            if (trail === ", ") {
              const nb = document.createElement("span");
              nb.className = "s-nb";
              nb.appendChild(w);
              words.push(w);
              const comma = document.createElement("span");
              comma.className = "s-word";
              comma.textContent = ",";
              nb.appendChild(comma);
              words.push(comma);
              spokenEl.appendChild(nb);
              spokenEl.appendChild(document.createTextNode(" "));
            } else {
              spokenEl.appendChild(w);
              if (trail) spokenEl.appendChild(document.createTextNode(trail));
            }
            if (trail !== ", ") words.push(w);
          });

          // Market stream tiles — deterministic start points around the lower frame
          const stream = q("#s-stream");
          const STARTS = [];
          for (let i = 0; i < 24; i++) {
            // a loose 6 × 4 cloud of listings below the bar, jittered by index
            const col = i % 6;
            const rowN = Math.floor(i / 6);
            STARTS.push([130 + col * 164 + ((rowN % 2) * 60 - 30), 950 + rowN * 128 + ((col * 37) % 40) - 20]);
          }
          STARTS.forEach((p, i) => {
            const m = document.createElement("div");
            m.className = "s-mini";
            m.id = "s-mini" + i;
            m.style.left = p[0] + "px";
            m.style.top = p[1] + "px";
            stream.appendChild(m);
          });

          // Ranked results
          const CARDS = [
            ["1.050 €", "2 Zimmer · 58 m² · Balkon · ruhig", true],
            ["990 €", "2 Zimmer · 52 m² · Balkon · Hofseite", false],
            ["1.090 €", "2 Zimmer · 61 m² · Balkon · Altbau", false],
          ];
          const cardsEl = q("#s-cards");
          CARDS.forEach(([price, spec, top], i) => {
            const c = document.createElement("div");
            c.className = "s-card";
            c.id = "s-card" + i;
            c.innerHTML =
              '<span class="s-rank">' + (i + 1) + '</span><span class="s-thumb"></span><div class="s-meta"><span class="s-price">' + price +
              '</span><span class="s-spec">' + spec + '</span><span class="s-loc">1070 Wien · Neubau</span></div>' +
              (top ? '<span class="s-badge">Top-Treffer</span>' : "");
            cardsEl.appendChild(c);
          });

          const tl = gsap.timeline({ paused: true });
          const P3 = "power3.out";
          const wordsIn = (sel, t) =>
            tl.fromTo(sel, { y: 60, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: P3, stagger: 0.08 }, t);
          const wordsOut = (sel, t) =>
            tl.to(sel, { y: -50, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in", stagger: 0.03 }, t);

          // Initial states
          gsap.set(["#s-t2 .s-wd", "#s-t3 .s-wd"], { opacity: 0 });
          gsap.set(".s-segfill", { scaleX: 0 });
          gsap.set(words, { opacity: 0 });
          gsap.set(".s-hl", { scaleX: 0 });
          gsap.set("#s-caret", { opacity: 0 });
          gsap.set(["#s-tags .s-tag", "#s-sub2", "#s-sub3", ".s-mini"], { opacity: 0 });
          gsap.set("#s-sweep", { x: -420 });

          // ---------- Header ----------
          tl.fromTo("#s-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: P3 }, 0.1);
          tl.fromTo("#s-prog", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2);

          // ---------- Step 1: type or talk ----------
          tl.to("#s-seg0", { scaleX: 1, duration: 4.1, ease: "none" }, 0.2);
          wordsIn("#s-t1 .s-wd", 0.15);
          tl.fromTo("#s-toggle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: P3 }, 0.5);
          tl.fromTo("#s-sub1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: P3 }, 0.8);
          tl.set("#s-placeholder", { opacity: 0 }, 0.95);
          tl.set("#s-caret", { opacity: 1 }, 0.95);
          typedChars.forEach((c, i) => tl.set(c, { display: "inline" }, 1.0 + i * 0.042 + (i > 13 ? 0.06 : 0)));
          tl.set("#s-caret", { opacity: 0 }, 2.3);
          // switch to voice
          tl.to("#s-slider", { x: 286, duration: 0.45, ease: "power3.inOut" }, 2.3);
          tl.to("#s-optType", { color: "#d6ecf3", duration: 0.3 }, 2.35);
          tl.to("#s-optVoice", { color: "#04131b", duration: 0.3 }, 2.4);
          tl.to("#s-typed", { opacity: 0, y: -20, duration: 0.25, ease: "power3.in" }, 2.35);
          tl.to("#s-mic", { scale: 0.88, duration: 0.1, ease: "power2.in" }, 2.45);
          tl.to("#s-mic", { scale: 1, duration: 0.45, ease: P3 }, 2.57);
          for (let k = 0; k < 4; k++) {
            tl.fromTo(k % 2 ? "#s-pulse1" : "#s-pulse0", { scale: 1, opacity: 0.85 }, { scale: 1.55, opacity: 0, duration: 0.8, ease: P3 }, 2.6 + k * 0.42);
          }
          words.forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: P3 }, 2.7 + i * 0.21);
          });

          // ---------- Step 2: AI understands ----------
          tl.to("#s-seg1", { scaleX: 1, duration: 4.0, ease: "none" }, 4.3);
          wordsOut("#s-t1 .s-wd", 4.3);
          wordsIn("#s-t2 .s-wd", 4.5);
          tl.to(["#s-toggle", "#s-sub1"], { opacity: 0, y: -24, duration: 0.3, ease: "power3.in" }, 4.3);
          tl.fromTo("#s-sweep", { x: -420 }, { x: 1800, duration: 0.75, ease: "power2.inOut", immediateRender: false }, 4.45);
          kws.forEach((kw, i) => {
            const t = 4.8 + i * 0.3;
            tl.fromTo(kw.querySelector(".s-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, t);
            tl.to(kw, { color: "#c6f6fc", duration: 0.3 }, t);
