<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
        }
        @font-face {
          font-family: "Josefin Sans";
          src: url("assets/fonts/josefin-sans-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
        }
        #y-root {
          position: absolute;
          inset: 0;
          font-family: "Inter", sans-serif;
          color: #f5f5f7;
        }
        #y-kicker {
          position: absolute;
          left: 80px;
          top: 120px;
          font-family: "Josefin Sans", sans-serif;
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.28em;
          color: #6fe3f3;
        }
        #y-head {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 172px;
          font-weight: 700;
          font-size: 76px;
          line-height: 1.08;
          letter-spacing: -0.04em;
        }
        #y-head span {
          display: block;
        }
        #y-sub {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 356px;
          font-size: 36px;
          font-weight: 600;
          line-height: 1.3;
          color: #86868b;
        }
        .y-card {
          position: absolute;
          left: 80px;
          right: 80px;
          border-radius: 32px;
          background: #1c1c1e;
          border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #y-card1 {
          top: 470px;
          height: 300px;
        }
        #y-card2 {
          top: 800px;
          height: 330px;
        }
        .y-title {
          position: absolute;
          left: 40px;
          top: 34px;
          font-size: 36px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .y-desc {
          position: absolute;
          left: 40px;
          right: 40px;
          top: 86px;
          font-size: 28px;
          font-weight: 500;
          line-height: 1.35;
          color: #aeaeb2;
        }
        #y-agent {
          position: absolute;
          left: 30px;
          right: 30px;
          bottom: 30px;
          height: 84px;
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 0 20px;
          border-radius: 20px;
          background: #2c2c2e;
        }
        .y-radar {
          position: relative;
          flex: none;
          width: 52px;
          height: 52px;
          border-radius: 50%;
          border: 2px solid rgba(111, 227, 243, 0.5);
          overflow: hidden;
        }
        #y-sweep {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: conic-gradient(from 0deg, rgba(111, 227, 243, 0.6), rgba(111, 227, 243, 0) 26%);
        }
        .y-crit {
          display: block;
          flex: 1;
          min-width: 0;
          font-size: 28px;
          font-weight: 600;
          white-space: nowrap;
        }
        .y-state {
          position: relative;
          flex: none;
          width: 240px;
          height: 50px;
        }
        .y-pill {
          position: absolute;
          right: 0;
          top: 0;
          display: flex;
          align-items: center;
          gap: 10px;
          height: 50px;
          padding: 0 16px;
          border-radius: 999px;
          font-size: 28px;
          font-weight: 600;
          white-space: nowrap;
        }
        #y-active {
          background: rgba(255, 255, 255, 0.07);
          color: #d2d2d7;
        }
        #y-active i {
          display: block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #6fe3f3;
        }
        #y-new {
          background: #12b4cd;
          color: #000000;
        }
        #y-svg {
          position: absolute;
          left: 40px;
          right: 40px;
          bottom: 30px;
          width: 840px;
          height: 140px;
        }
      </style>

      <div id="y-root" data-composition-id="beyond" data-width="1080" data-height="1350">
        <div id="y-kicker">UND DANACH</div>
        <div id="y-head"><span>Suchagenten statt</span><span>Dauer-Refresh.</span></div>
        <div id="y-sub">Der Markt wird beobachtet, nicht nur durchsucht.</div>

        <div id="y-card1" class="y-card">
          <div class="y-title">KI-Suchagenten</div>
          <div class="y-desc">Beobachten den Markt laufend und melden passende neue Inserate.</div>
          <div id="y-agent">
            <span class="y-radar"><span id="y-sweep"></span></span>
            <span class="y-crit">2 Zi · Balkon · bis 1.100 €</span>
            <span class="y-state">
              <span id="y-active" class="y-pill"><i></i>Aktiv</span>
              <span id="y-new" class="y-pill">1 neuer Treffer</span>
            </span>
          </div>
        </div>

        <div id="y-card2" class="y-card">
          <div class="y-title">Marktanalysen</div>
          <div class="y-desc">Preise und Entwicklungen je Lage auf einen Blick.</div>
          <svg id="y-svg" viewBox="0 0 840 140" fill="none">
            <defs>
              <linearGradient id="y-areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#12b4cd" stop-opacity="0.3" />
                <stop offset="1" stop-color="#12b4cd" stop-opacity="0" />
              </linearGradient>
            </defs>
            <line x1="0" y1="130" x2="840" y2="130" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
            <path id="y-area" fill="url(#y-areaGrad)" />
            <path id="y-line" stroke="#6fe3f3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <circle id="y-end" cx="820" cy="24" r="9" fill="#b8f6ff" stroke="#1c1c1e" stroke-width="4" />
          </svg>
        </div>
      </div>

      <script>
        (function () {
          // Illustrative trend shape — no values are shown or implied.
          const PTS = [[20, 112], [160, 96], [300, 104], [440, 76], [580, 66], [720, 44], [820, 24]];
          let d = "M" + PTS[0][0] + " " + PTS[0][1];
          for (let i = 0; i < PTS.length - 1; i++) {
            const p0 = PTS[Math.max(0, i - 1)], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[Math.min(PTS.length - 1, i + 2)];
            const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
            const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
            d += " C" + c1[0] + " " + c1[1] + " " + c2[0] + " " + c2[1] + " " + p2[0] + " " + p2[1];
          }
          const line = document.getElementById("y-line");
          line.setAttribute("d", d);
          document.getElementById("y-area").setAttribute("d", d + " L820 130 L20 130 Z");
          const len = line.getTotalLength();
          line.style.strokeDasharray = len;

          gsap.set(["#y-head span", "#y-sub", ".y-card", "#y-new", "#y-area"], { opacity: 0 });
          gsap.set("#y-line", { strokeDashoffset: len });
          gsap.set("#y-end", { scale: 0, transformOrigin: "50% 50%" });

          const tl = gsap.timeline({ paused: true });
          const soft = "power3.out";

          tl.fromTo("#y-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: soft }, 0.1);
          tl.fromTo("#y-head span", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: soft, stagger: 0.12 }, 0.25);
          tl.fromTo("#y-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: soft }, 0.7);

          // agents keep looking while you do something else
          tl.fromTo("#y-card1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: soft }, 1.0);
          tl.fromTo("#y-sweep", { rotation: 0 }, { rotation: 900, duration: 5.0, ease: "none" }, 1.0);
          tl.to("#y-active", { opacity: 0, duration: 0.25 }, 2.5);
          tl.fromTo("#y-new", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: soft }, 2.55);

          // and the market itself becomes readable
          tl.fromTo("#y-card2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: soft }, 1.6);
          tl.to("#y-line", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 2.0);
          tl.to("#y-area", { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.4);
          tl.to("#y-end", { scale: 1, duration: 0.3, ease: soft }, 3.0);

          tl.to("#y-root > *", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 5.75);
          window.__timelines["beyond"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
