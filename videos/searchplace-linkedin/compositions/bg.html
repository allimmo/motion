<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #000000;
        }
        #bg-grid {
          position: absolute;
          left: 0;
          top: -100px;
          width: 1080px;
          height: 1600px;
          background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.4px, transparent 1.6px);
          background-size: 40px 40px;
          -webkit-mask-image: radial-gradient(75% 55% at 50% 50%, #000 0%, transparent 100%);
          mask-image: radial-gradient(75% 55% at 50% 50%, #000 0%, transparent 100%);
        }
        #bg-glow {
          position: absolute;
          left: 90px;
          top: 300px;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(18, 180, 205, 0.12) 0%, rgba(18, 180, 205, 0.04) 40%, rgba(18, 180, 205, 0) 68%);
        }
      </style>
      <div id="bg-root" data-composition-id="bg" data-width="1080" data-height="1350">
        <div id="bg-grid" data-layout-allow-overflow></div>
        <div id="bg-glow"></div>
      </div>
      <script>
        // A quiet drafting-table ground: faint dot grid, one soft light, slow drift.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#bg-grid", { y: 0 }, { y: -80, duration: 32.5, ease: "none" }, 0);
        tl.fromTo("#bg-glow", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 2, ease: "power2.out" }, 0);
        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
